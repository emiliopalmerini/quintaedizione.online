[project]
name = "pdf-pipeline"
version = "0.1.0"
description = "PDF-to-Markdown pipeline for D&D 5e SRD content"
requires-python = ">=3.11"
dependencies = [
    "pdftext",
    "numpy",
    "click",
]

[project.scripts]
pdf-pipeline = "pdf_pipeline.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_pipeline"]
