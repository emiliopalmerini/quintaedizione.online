name: Check Rebase on Main

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if branch is rebased on main
        run: |
          git fetch origin main
          
          # Get the merge base
          merge_base=$(git merge-base HEAD origin/main)
          
          # Check if the merge base is the same as origin/main HEAD
          main_head=$(git rev-parse origin/main)
          
          if [ "$merge_base" = "$main_head" ]; then
            echo "✓ Branch is properly rebased on main"
            exit 0
          else
            echo "✗ Branch is NOT rebased on main"
            echo "To rebase: git rebase origin/main"
            exit 1
          fi
